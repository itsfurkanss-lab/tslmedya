<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tsl Media</title>
<style>
:root{--bg:#f6f6f9;--surface:#fff;--surface2:#f0f0f5;--text:#14141c;--muted:#6b6b7b;--line:#e4e4ec;--accent:#7c3aed;--accent2:#ec4899;--accent3:#f59e0b;--danger:#e11d48;--ok:#16a34a;--shadow:0 6px 24px rgba(20,20,40,.08);--r:18px;--grad:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b)}
:root[data-theme=dark]{--bg:#0c0c12;--surface:#16161f;--surface2:#1f1f2b;--text:#f3f3f8;--muted:#9a9aae;--line:#2a2a38;--shadow:0 6px 24px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0c12;--surface:#16161f;--surface2:#1f1f2b;--text:#f3f3f8;--muted:#9a9aae;--line:#2a2a38;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
.shell{display:grid;grid-template-columns:250px minmax(0,620px) 320px;gap:24px;max-width:1220px;margin:0 auto;padding:0 16px;min-height:100%}
.nav{position:sticky;top:0;height:100dvh;padding:20px 0;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px;padding:6px 14px 16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.nav a,.nav button.navbtn{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-weight:600;font-size:16px;position:relative;text-align:left;width:100%;transition:background .15s,transform .1s}
.nav a:hover,.nav button.navbtn:hover{background:var(--surface2)}
.nav a:active,.nav button.navbtn:active{transform:scale(.97)}
.nav a.on{background:var(--surface);box-shadow:var(--shadow)}
.badge{min-width:19px;height:19px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;margin-left:auto}
.main{padding:20px 0 90px;min-width:0}
.aside{position:sticky;top:0;height:100dvh;overflow:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
h1,h2,h3{margin:0;letter-spacing:-.3px}
h2{font-size:19px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.col{display:flex;flex-direction:column;gap:12px}
.av{border-radius:50%;background:var(--surface2);object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.ring{padding:2.5px;border-radius:50%;background:var(--grad);flex:none;display:inline-flex}
.ring.seen{background:var(--line)}
.ring .av{border:2.5px solid var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:700;background:var(--text);color:var(--bg);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--grad);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .1s}
.ic:hover{background:var(--surface2)}.ic:active{transform:scale(.88)}
input[type=text],input[type=password],input[type=email],textarea,select{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.err{color:var(--danger);font-size:13px;font-weight:600}.okc{color:var(--ok);font-size:13px;font-weight:600}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.tabs button.on{background:var(--text);color:var(--bg)}
.post{margin-bottom:14px;overflow:hidden;animation:rise .35s ease both}
.post .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.post .body{padding:2px 16px 12px;white-space:pre-wrap;word-break:break-word}
.post .body a{color:var(--accent);font-weight:600}
.media{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000;scrollbar-width:none}
.media::-webkit-scrollbar{display:none}
.media>*{flex:0 0 100%;scroll-snap-align:center;max-height:640px;width:100%;object-fit:contain;background:#000;min-height:200px}
.dots{display:flex;gap:5px;justify-content:center;padding:8px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.acts{display:flex;align-items:center;gap:2px;padding:6px 10px 12px}
.act{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:background .15s,color .15s,transform .1s}
.act:hover{background:var(--surface2)}.act:active{transform:scale(.9)}
.act.liked{color:var(--danger)}.act.liked svg{fill:currentColor;animation:pop .35s ease}
.act.on{color:var(--accent)}.act.on svg.bk{fill:currentColor}
.quote{margin:0 16px 12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:block}
.rphd{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;padding:0 6px 6px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;font-size:12px;font-weight:600}
.story span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addbadge{position:relative}.addbadge b{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;border:2px solid var(--bg);font-size:15px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid a{aspect-ratio:1;background:var(--surface2);position:relative;overflow:hidden;display:block}
.grid img,.grid video{width:100%;height:100%;object-fit:cover}
.grid .tx{padding:10px;font-size:13px;overflow:hidden;display:flex;align-items:center;text-align:center;justify-content:center;height:100%;word-break:break-word}
.grid .tag{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px #0008)}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13px;margin:0 6px 6px 0}
.userrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.userrow .nm{min-width:0;flex:1}.userrow .nm b,.userrow .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s ease}
.modal{width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);animation:rise .25s ease both}
.popover{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:190px;animation:fade .12s ease}
.popover button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;font-weight:600;text-align:left}
.popover button:hover{background:var(--surface2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:90;animation:rise .25s ease both;max-width:90vw}
.toast.bad{background:var(--danger);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .25s}
.strength{display:flex;gap:4px}.strength i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.reels{height:calc(100dvh - 40px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:var(--r);background:#000;scrollbar-width:none;margin-top:-6px}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff;background:#000}
.reel video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.reel .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.reel .info{position:absolute;left:14px;right:84px;bottom:18px;display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 3px #0009}
.reel .rail{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.reel .rail button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:12px;font-weight:700;filter:drop-shadow(0 1px 3px #0009);transition:transform .1s}
.reel .rail button:active{transform:scale(.85)}
.reel .rail svg{width:30px;height:30px}
.reel .liked svg{fill:var(--danger);stroke:var(--danger);animation:pop .35s ease}
.reel .mid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.reel .mid>*{opacity:0;transition:opacity .2s}.reel .mid>.show{opacity:1}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #fff4;border-top-color:#fff;animation:rot .8s linear infinite}
.reel .follow{border:1.5px solid #fff;color:#fff;padding:3px 12px;border-radius:8px;font-size:13px;font-weight:700}
.msgwrap{display:grid;grid-template-columns:260px 1fr;min-height:70dvh;overflow:hidden}
.convs{border-right:1px solid var(--line);overflow:auto;max-height:76dvh}
.conv{display:flex;gap:10px;padding:12px 14px;align-items:center;width:100%;text-align:left}
.conv:hover,.conv.on{background:var(--surface2)}
.thread{display:flex;flex-direction:column;max-height:76dvh}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 13px;border-radius:18px;background:var(--surface2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--grad);color:#fff}
.bub small{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
.notif{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:background .15s}
.notif:hover{background:var(--surface2)}.notif.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.notif .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:auto;flex:none}
.notif.fresh{animation:rise .4s ease both}
.sv{position:fixed;inset:0;background:#000;z-index:80;display:grid;place-items:center;color:#fff;animation:fade .2s ease}
.sv .frame{position:relative;width:min(440px,100vw);height:min(100dvh,820px);background:#111;border-radius:18px;overflow:hidden}
.sv img,.sv video{width:100%;height:100%;object-fit:contain}
.sv .prog{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.sv .prog i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}.sv .prog i b{display:block;height:100%;width:0;background:#fff}
.sv .top{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:3;text-shadow:0 1px 3px #000a}
.sv .zone{position:absolute;top:60px;bottom:90px;width:35%;z-index:2}
.sv .bot{position:absolute;bottom:0;left:0;right:0;padding:12px;z-index:3;background:linear-gradient(transparent,#000b)}
.sv input{background:#fff2;color:#fff;border-radius:999px}
.hero{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% 10%,#7c3aed44,transparent),radial-gradient(800px 500px at 90% 90%,#ec489944,transparent),var(--bg)}
.authbox{width:100%;max-width:420px;padding:26px}
.topbar{display:none}
.bottom{display:none}
.profile-h{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:22px}.stats button{text-align:center;font-weight:700}.stats small{display:block;font-weight:500;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
.view{animation:fade .25s ease}
@media(max-width:1060px){.shell{grid-template-columns:76px minmax(0,1fr)}.aside{display:none}.nav a span,.nav .logo,.nav button.navbtn span{display:none}.nav a,.nav button.navbtn{justify-content:center;padding:12px}.nav .badge{position:absolute;top:2px;right:6px;margin:0}}
@media(max-width:720px){
 .shell{display:block;padding:0 10px}.nav{display:none}
 .main{padding:62px 0 84px}
 .topbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:30;height:54px;align-items:center;padding:0 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
 .topbar .logo{padding:0;font-size:23px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .bottom a{padding:9px 16px;border-radius:14px;color:var(--muted);position:relative}.bottom a.on{color:var(--text)}
 .bottom a.mk{background:var(--grad);color:#fff;padding:9px 20px}
 .reels{height:calc(100dvh - 54px - 66px - env(safe-area-inset-bottom));margin:-8px -10px 0;border-radius:0;width:calc(100% + 20px)}
 .msgwrap{grid-template-columns:1fr}.msgwrap .convs.hide,.msgwrap .thread.hide{display:none}.convs{border-right:0}
 .grid{gap:2px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
